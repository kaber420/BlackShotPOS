[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackshot-pos"
version = "0.1.0"
description = "Backend y API para el sistema de Punto de Venta Blackshot"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Blackshot Team"}
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pyjwt",
    "pyotp",
    "argon2-cffi",
    "cryptography",
    "python-dotenv",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[project.scripts]
blackshot = "pos_core.cli:start"

[tool.setuptools]
packages = ["pos_core", "omni_auth"]
