[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackshot-pos"
version = "0.1.0"
description = "Backend y API para el sistema de Punto de Venta Blackshot"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Blackshot Team"}
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pyjwt",
    "pyotp",
    "argon2-cffi",
    "cryptography",
    "python-dotenv",
    "python-multipart",
    "sse-starlette",
    "python-escpos",
    "sqlmodel",
    "aiosqlite",
    "websockets",
    "fastapi-users[sqlalchemy]>=12.1.2",
    "passlib[argon2]",
    "python-jose[cryptography]",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[project.scripts]
blackshot = "pos_core.cli:start"

[tool.setuptools]
packages = ["pos_core"]
